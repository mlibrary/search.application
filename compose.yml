services:
  app:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    env_file:
      - .env
  web:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    depends_on:
      - 'redis'
      - 'catalog-api'
    ports:
      - 4567:4567
      - 9100:9100
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
      - OTEL_SERVICE_NAME=search-application
    command:
      - bundle
      - exec
      - puma
      - -b
      - "tcp://0.0.0.0:4567"
  sidekiq:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    ports:
      - 9292:9292
    depends_on:
      - 'redis'
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    command:
      - bundle
      - exec
      - puma
      - --no-config
      - -b
      - "tcp://0.0.0.0:9292"
      - sidekiq.ru
  worker:
    build:
      context: .
      target: development
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    depends_on:
      - 'redis'
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379
    command:
      - bundle
      - exec
      - sidekiq
      - -r
      - "./app.rb"
  catalog-api:
    image: ghcr.io/mlibrary/search.catalog-api-unstable:latest
    env_file:
      - .env
    environment:
      - OTEL_SERVICE_NAME=search-api
      - OTEL_METRICS_EXPORTER=none
      - OTEL_TRACES_EXPORTER=otlp_proto_http
      - OTEL_EXPORTER_OTLP_INSECURE=true
    ports:
      - 8000:8000
    command:
      - python
      - -m
      - uvicorn
      - api.main:app
      - --host
      - 0.0.0.0
  parser:
    image: ghcr.io/mlibrary/search.parser-unstable:latest
    ports:
      - 4000:4567
    environment:
      - APP_ENV=production
      - OTEL_SERVICE_NAME=search-parser
    env_file:
      - .env
    command:
      - bundle
      - exec
      - puma
      - -b
      - "tcp://0.0.0.0:4567"
  redis:
    image: 'redis:latest'
    command: redis-server
    ports:
      - '6379:6379'
    volumes:
      - 'redis:/data'
  js:
    build:
      context: .
      target: assets
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    env_file:
      - .env
    command:
      - npm
      - run
      - watch:js
  css:
    build:
      context: .
      target: assets
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    volumes:
      - .:/app
    env_file:
      - .env
    command:
      - npm
      - run
      - watch:css
  jaeger:
    image: jaegertracing/jaeger:latest
    ports:
      - 5778:5778
      - 16686:16686
      - 4317:4317
      - 4318:4318
      - 9411:9411
volumes:
  redis:
